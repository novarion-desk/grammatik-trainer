<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammatik Trainer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Grammatik">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20viewBox%3D%220%200%20120%20120%22%20aria-hidden%3D%22true%22%3E%3Crect%20width%3D%22120%22%20height%3D%22120%22%20rx%3D%2228%22%20fill%3D%22%234f46e5%22/%3E%3Cpath%20d%3D%22M60%2030C46%2022%2028%2022%2012%2028V84C28%2078%2046%2078%2060%2086Z%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M60%2030C74%2022%2092%2022%20108%2028V84C92%2078%2074%2078%2060%2086Z%22%20fill%3D%22%23e0e7ff%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2240%22%20width%3D%2228%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%232563eb%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2252%22%20width%3D%2222%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23d97706%22/%3E%3Crect%20x%3D%2222%22%20y%3D%2264%22%20width%3D%2226%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%2316a34a%22/%3E%3Crect%20x%3D%2270%22%20y%3D%2240%22%20width%3D%2228%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%237c3aed%22/%3E%3Crect%20x%3D%2270%22%20y%3D%2252%22%20width%3D%2222%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%232563eb%22/%3E%3Crect%20x%3D%2270%22%20y%3D%2264%22%20width%3D%2226%22%20height%3D%226%22%20rx%3D%223%22%20fill%3D%22%23d97706%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Richtung: wie Lightning. Weiss und Slate, Indigo als einzige Bedienfarbe, runde Karten.
   Die vier Fallfarben sind Fachfarben (gleich wie die Satzglied-Farben) und erscheinen nur als helle Chips. */
:root{
  --bg:#f8fafc; --surface:#ffffff; --alt:#f1f5f9; --line:#e2e8f0; --line2:#cbd5e1;
  --text:#0f172a; --muted:#475569;
  --primary:#4f46e5; --primary-h:#4338ca; --primary-l:#eef2ff;
  --ok:#16a34a; --ok-l:#f0fdf4; --bad:#dc2626; --bad-l:#fef2f2; --warn-l:#fffbeb; --warn:#d97706;
  --radius:1rem; --radius-s:.75rem;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --f:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);line-height:1.55;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
[hidden]{display:none!important}
.f-nom{--c:#2563eb;--b:#dbeafe;--t:#1e3a8a}
.f-gen{--c:#d97706;--b:#fef3c7;--t:#78350f}
.f-dat{--c:#7c3aed;--b:#ede9fe;--t:#4c1d95}
.f-akk{--c:#16a34a;--b:#dcfce7;--t:#14532d}

/* Kopf */
@media (max-width:700px){header{position:static!important}.tchips.sticky{top:0!important}}
header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.hin{max-width:1000px;margin:0 auto;padding:.6rem 1rem;display:flex;flex-wrap:wrap;gap:.5rem .8rem;align-items:center}
.brand{display:flex;align-items:center;gap:.6rem;border:0;background:none;padding:0;text-align:left;min-height:44px}
.logo{width:38px;height:38px;display:block;flex:none}.logo svg{display:block}
.brand b{display:block;font-size:1rem;line-height:1.15}
.brand span{display:block;font-size:.75rem;color:var(--muted)}
.crumb{flex:1 1 12rem;font-size:.85rem;color:var(--muted);min-width:0}
.seg{display:inline-flex;background:var(--alt);border:1px solid var(--line);border-radius:var(--radius-s);padding:.2rem;gap:.15rem}
.seg button{border:0;background:transparent;border-radius:.55rem;min-height:40px;min-width:44px;padding:.2rem .7rem;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.lblniv{font-size:.75rem;color:var(--muted);font-weight:600}

main{max-width:1000px;margin:0 auto;padding:1.2rem 1rem 3rem}
h1,h2,h3{line-height:1.2;margin:0}
h2.page{font-size:1.6rem;font-weight:800;margin-bottom:.3rem}
.sub{color:var(--muted);margin:.2rem 0 1.2rem}

/* Bausteine */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:46px;padding:.5rem 1.1rem;border-radius:var(--radius-s);border:1px solid var(--line2);background:var(--surface);font-weight:600;font-size:.95rem;transition:background .15s,border-color .15s}
.btn:hover{background:var(--alt)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-h)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:44px;font-size:.85rem;padding:.35rem .8rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
.card h3{font-size:1.05rem;margin-bottom:.5rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
@media (max-width:900px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){.grid2,.grid4{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:.12rem .55rem;border-radius:6px;background:var(--primary-l);color:var(--primary)}
.pill.gray{background:var(--alt);color:var(--muted)}
.tag{display:inline-block;padding:.05rem .6rem;border-radius:999px;background:var(--b);border:1.5px solid var(--c);color:var(--t);font-weight:700;font-size:.82em;white-space:nowrap}
mark.w{background:var(--b);color:inherit;box-shadow:inset 0 -3px 0 var(--c);border-radius:.2rem;padding:0 .12em}
.muted{color:var(--muted)}
.callout{margin-top:1rem;padding:.85rem 1.1rem;border-radius:var(--radius-s);background:var(--warn-l);border:1px solid #fcd34d}
.callout.info{background:var(--primary-l);border-color:#c7d2fe}

/* Start und Kapitel */
.bigcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
@media (max-width:640px){.bigcards{grid-template-columns:minmax(0,1fr)}}
.bigcard{display:flex;flex-direction:column;align-items:flex-start;gap:.4rem;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.2rem 1.3rem;box-shadow:var(--shadow);min-height:120px;transition:border-color .15s,transform .15s}
.bigcard:hover{border-color:var(--primary);transform:translateY(-2px)}
.bigcard b{font-size:1.2rem}
.bigcard span{color:var(--muted);font-size:.92rem}
.bigcard .go{margin-top:auto;color:var(--primary);font-weight:700}
.nivcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin:.6rem 0 1.4rem}
@media (max-width:640px){.nivcards{grid-template-columns:minmax(0,1fr)}}
.nivcard{text-align:left;background:var(--surface);border:1.5px solid var(--line2);border-radius:var(--radius-s);padding:.8rem 1rem;min-height:84px}
.nivcard.on{border-color:var(--primary);background:var(--primary-l)}
.nivcard b{display:block;font-size:1rem}
.nivcard span{font-size:.84rem;color:var(--muted)}
.chlist{display:grid;gap:.6rem;margin-top:.6rem}
.chrow{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);padding:.7rem 1rem;min-height:56px}
.chrow .n{flex:0 0 2rem;height:2rem;border-radius:8px;background:var(--alt);display:grid;place-items:center;font-weight:700;color:var(--muted)}
.chrow.act{border-color:var(--primary);box-shadow:var(--shadow)}
.chrow.act .n{background:var(--primary);color:#fff}
.chrow b{flex:1}
.chrow.off{opacity:.55;cursor:default}

/* Lernen */
.toc{position:sticky;top:61px;z-index:20;background:rgba(248,250,252,.95);backdrop-filter:blur(6px);padding:.5rem 0;margin:0 0 .8rem;display:flex;gap:.4rem;overflow-x:auto;-webkit-overflow-scrolling:touch}
.toc button{flex:0 0 auto;min-height:44px;border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:.3rem .9rem;font-weight:600;font-size:.85rem;color:var(--muted)}
.toc button:hover{border-color:var(--primary);color:var(--primary)}
.sec{scroll-margin-top:120px;margin-bottom:1.6rem}
.sec>h2{font-size:1.3rem;font-weight:800;margin-bottom:.6rem}
.sec h3.pr{font-size:1.1rem;margin:1.2rem 0 .5rem}
.sent{font-size:1.2rem;margin:.3rem 0 .6rem}
.fcard{border:2px solid var(--c);background:var(--b);border-radius:var(--radius);padding:.9rem 1rem}
.fcard h3{font-size:1rem;color:var(--t)}
.fcard .q{font-size:1.35rem;font-weight:800;margin:.25rem 0;color:var(--t)}
.fcard .role{font-size:.92rem;margin-bottom:.5rem}
.fcard .ex{background:#fff;border-radius:.6rem;padding:.45rem .7rem;font-size:.95rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:.3rem 0 .3rem 2.1rem}
.steps li::before{content:counter(s);position:absolute;left:0;top:.35rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--primary);color:#fff;text-align:center;font-weight:700;font-size:.85rem;line-height:1.5rem}
.sol{margin-top:.5rem;padding:.6rem .9rem;border-radius:var(--radius-s);background:var(--ok-l);border:1px solid #86efac;font-size:.95rem}
.sol p{margin:.15rem 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:.5rem .7rem;text-align:left;vertical-align:top;background:var(--surface)}
th{background:var(--alt)}
td.rh{font-weight:700;background:var(--b);border-left:5px solid var(--c);color:var(--t)}
tr.dim td,tr.dim th{opacity:.28}
.showsame td.same{background:#fef9c3;box-shadow:inset 0 0 0 2px #eab308;font-weight:700}
.btnrow{display:flex;flex-wrap:wrap;gap:.45rem;margin:.2rem 0 .8rem}
.btnrow button{min-height:44px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--radius-s);padding:.3rem .8rem;font-weight:600;font-size:.85rem}
.btnrow button.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.uw .u{border-radius:.2rem;padding:0 .12em;font-weight:600}
.uw.on .u{background:var(--b);box-shadow:inset 0 -3px 0 var(--c)}
.uw p{margin:.3rem 0;font-size:1.1rem}
.stone b{display:block;margin-bottom:.25rem}

/* Fall-Knöpfe und Optionen */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem;margin:.8rem 0}
.opt{min-height:54px;text-align:left;border:1.5px solid var(--line2);background:var(--surface);border-radius:var(--radius-s);padding:.6rem .9rem;font-weight:600;font-size:1rem;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--primary);background:var(--primary-l)}
.opt.fall{border-left:6px solid var(--c)}
.opt.sel{border-color:var(--primary);background:var(--primary-l);color:#312e81;box-shadow:inset 0 0 0 1px var(--primary)}
.opt.right{border-color:var(--ok);background:var(--ok-l);color:#14532d}
.opt.wrong{border-color:var(--bad);background:var(--bad-l);color:#7f1d1d}
.opt[disabled]{cursor:default}
.opt.right::after{content:' ✓';font-weight:800}.opt.wrong::after{content:' ✗';font-weight:800}
.chip.right::after{content:' ✓'}.chip.wrong::after{content:' ✗'}
.fb{margin-top:1rem;padding:.9rem 1.1rem;border-radius:var(--radius-s);border-left:5px solid;font-size:.95rem}
.fb.ok{background:var(--ok-l);border-color:var(--ok);color:#14532d}
.fb.err{background:var(--bad-l);border-color:var(--bad);color:#7f1d1d}
.hl{background:#fde68a;color:var(--text);border-radius:.4rem;padding:.05rem .35rem;font-weight:700}
.gap{display:inline-block;min-width:4.5rem;border-bottom:3px solid var(--primary);text-align:center;color:var(--primary);font-weight:700}
.mc{padding:.9rem 1rem;margin:0 0 .8rem;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface)}
.grp{background:#fde68a;border-radius:.4rem;padding:.05rem .35rem;font-weight:700}

/* Üben */
.cfg h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:1rem 0 .4rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem}
.chk{display:flex;flex-wrap:wrap;gap:.5rem}
.chk.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.6rem}
.chk.cards label{display:block;position:relative;min-height:76px;padding:.6rem .85rem;border-radius:1rem}.chk.cards label input{position:absolute;opacity:0;width:1px;height:1px}
.chk.cards b{display:block;font-size:1rem;margin-bottom:.15rem}.chk.cards small{display:block;font-weight:400;font-size:.85rem;color:var(--muted);line-height:1.35}
.wfield{width:100%;max-width:30rem;min-height:56px;font-size:1.3rem;border:2px solid var(--line2);border-radius:var(--radius-s);padding:.4rem .9rem;margin-top:.8rem;background:#fff}
.wfield:focus{outline:3px solid var(--primary-l);border-color:var(--primary)}.wfield.right{border-color:var(--ok);background:var(--ok-l)}.wfield.wrong{border-color:var(--bad);background:var(--bad-l)}
.chk label{display:inline-flex;align-items:center;gap:.5rem;min-height:46px;padding:.4rem .85rem;border:1.5px solid var(--line2);border-radius:var(--radius-s);background:var(--surface);font-weight:600;font-size:.92rem;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--primary)}
.chk label.sel{border-color:var(--primary);background:var(--primary-l)}
.chk.fall label.sel{border-color:var(--c);background:var(--b)}
.avail{margin-top:1rem;padding:.7rem 1rem;border-radius:var(--radius-s);background:var(--alt);font-weight:600}
.avail.warn{background:var(--warn-l);border:1px solid #fcd34d}
.avail.none{background:var(--bad-l);border:1px solid #fecaca;color:#7f1d1d}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.6rem;padding-bottom:.8rem;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.prog{display:flex;align-items:center;gap:.6rem;font-weight:600;font-size:.88rem;color:var(--muted)}
.bar{width:140px;height:10px;background:var(--alt);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);transition:width .25s}
.instr{font-weight:700;color:var(--primary);margin-bottom:.5rem}
.sbox{font-size:1.25rem;line-height:1.8;background:var(--alt);border:1px solid var(--line);border-radius:var(--radius-s);padding:1rem 1.2rem}
.hint{margin-top:.8rem;padding:.7rem 1rem;border-radius:var(--radius-s);background:var(--primary-l);border:1px solid #c7d2fe;font-size:.92rem}
.actions{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem;margin-top:1.2rem}
.brush{display:flex;flex-wrap:wrap;gap:.5rem;margin:.6rem 0}
.brush button{min-height:48px;border-radius:var(--radius-s);border:2px solid var(--c);background:var(--b);color:var(--t);font-weight:700;padding:.3rem .9rem}
.brush button.on{outline:3px solid var(--text);outline-offset:1px}
.flow{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;font-size:1.15rem;line-height:2.2;background:var(--alt);border:1px solid var(--line);border-radius:var(--radius-s);padding:.8rem 1rem}
.chip{min-height:46px;border:1.5px dashed var(--line2);background:var(--surface);border-radius:.6rem;padding:.2rem .8rem;font-weight:600}
.chip[class*=" p-"]{border-style:solid;border-color:var(--c);background:var(--b);color:var(--t)}
.chip.right{outline:3px solid var(--ok)}
.chip.wrong{outline:3px solid var(--bad)}
.plain{padding:.2rem .1rem}
.score{font-size:2.2rem;font-weight:800;color:var(--primary)}
.sumhead{text-align:center;background:var(--alt);border-radius:var(--radius-s);padding:1.2rem;margin-bottom:1.2rem}
.cat{border:1px solid var(--line);border-radius:var(--radius-s);padding:.7rem .9rem;background:var(--surface)}
.cat .top{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:.35rem}
.cat .b{height:7px;background:var(--alt);border-radius:999px;overflow:hidden}
.cat .b i{display:block;height:100%}
.rev{border:1px solid var(--line);border-left:5px solid;border-radius:.6rem;padding:.65rem .9rem;margin-top:.55rem;background:var(--surface);font-size:.92rem}
.rev.ok{border-left-color:var(--ok)}.rev.err{border-left-color:var(--bad)}
dialog{margin:auto;border:1px solid var(--line);border-radius:var(--radius);width:min(94vw,900px);max-height:88dvh;padding:0;box-shadow:0 20px 25px -5px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(15,23,42,.5)}
.mh{position:sticky;top:0;z-index:2;background:var(--surface);padding:.8rem 1rem;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:space-between}
.mb{padding:1rem;overflow-y:auto}
#merk{display:none}
.try{margin:1rem 0;padding:1rem 1.1rem;border:1.5px dashed #a5b4fc;border-radius:var(--radius);background:var(--primary-l)}
.try .sbox{background:#fff}
.resetbar{margin-top:1.6rem;padding-top:1rem;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;justify-content:flex-end;font-size:.9rem;color:var(--muted)}
.hero2{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:1.25rem;padding:1.2rem 1.4rem;margin-bottom:1rem}
.htitle{display:inline-flex;align-items:center;gap:.7rem;background:#2563eb;color:#fff;border-radius:1rem;padding:.5rem 1.2rem .5rem .6rem;font-size:1.7rem;font-weight:700;letter-spacing:-.01em}
.htitle svg{width:40px;height:40px;flex:none}.hero2 p{margin:.5rem 0 0;color:var(--muted);font-size:1.02rem}
.hero2 .hr{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}.hero2 .auth{display:flex;gap:.4rem;align-items:center;min-height:44px}
.cont{display:flex;gap:.9rem;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.8rem 1.1rem;margin-bottom:1.2rem}
.cont .ci{font-size:1.8rem}.cont .cb{flex:1}.cont b{font-size:1.05rem}
.pbar{height:6px;background:var(--line);border-radius:6px;margin-top:.35rem;width:100%}.pbar i{display:block;height:100%;border-radius:6px}.pbar.big{height:8px}
.tile.act,.tile.off{border-left:7px solid var(--tc,#4f46e5)}.tile{align-items:center;border-radius:1rem;transition:transform .12s,box-shadow .12s}
.tile.act:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,41,59,.12)}
.tile::before{display:none}.tile .ti{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.55rem;flex:none}
.tile{flex-wrap:wrap}.tile .tb{flex:1 1 0;min-width:0}.tile .tbtn{margin-top:.2rem;flex:1 0 100%;flex-wrap:wrap;justify-content:flex-start;padding-left:calc(46px + .9rem)}.tile .tbtn .btn{min-height:44px;padding:0 1rem}.tile .btn.t2{border-color:var(--primary);color:var(--primary)}
@media (max-width:640px){.tile .tbtn{padding-left:0}}

/* ---- Runde ---- */
function startRound(tasks,title){
  S.R={tasks,i:0,hist:[],title:title||'Runde',answered:false,choice:null,paint:{},sel:new Set(),brush:CK()[0],hint:false,order:null};
  S.screen='round';render();
}
function screenRound(){
  const R=S.R,t=R.tasks[R.i],T=TY()[t.typ],total=R.tasks.length;
  let body='';
  if(t.typ==='anmalen'){
    body='<div class="instr">'+T.instr+'</div><div class="brush">'+CK().map(k=>'<button class="f-'+k+' '+(R.brush===k?'on':'')+'" data-a="brush" data-k="'+k+'">'+CN()[k]+'</button>').join('')+'</div>'+
     '<div class="flow">'+t.parts.map((p,i)=>p.f?'<button class="chip" data-a="paint" data-i="'+i+'">'+p.t+'</button>':'<span class="plain">'+p.t+'</span>').join('')+'</div>';
  }else if(t.tokens){
    body='<div class="instr">'+(t.instr||T.instr)+'</div>'+(t.prompt?'<div class="sbox">'+t.prompt+'</div>':'')+'<div class="flow">'+t.tokens.map((x,i)=>'<button class="chip tok" data-a="tok" data-i="'+i+'">'+x+'</button>').join('')+'</div>';
  }else if(isW(t)){
    body='<div class="instr">'+(t.sent&&t.prompt?t.prompt:(T.winstr||T.instr))+'</div><div class="sbox">'+(t.sent||t.prompt)+'</div><input class="wfield" id="wfield" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Deine Antwort" placeholder="Deine Antwort">';
  }else{
    if(!R.order)R.order=shuffle(t.opts);
    body='<div class="instr">'+(t.typ==='zuordnen'?T.instr:T.instr)+'</div>'+(t.prompt?'<div class="sbox">'+t.prompt+'</div>':'<div class="sbox">'+t.sent+'</div>')+
     '<div class="opts">'+R.order.map((o,i)=>{const f=t.optCat&&t.optCat[o];return '<button class="opt '+(f?'fall f-'+f:'')+'" data-a="pick" data-i="'+i+'">'+o+'</button>';}).join('')+'</div>';
  }
  return '<div class="card"><div class="topbar"><button class="btn sm" data-a="stop">‹ Abbrechen</button><div><span class="pill">'+T.label+'</span> <span class="pill gray">'+['Einfach','Mittel','Schwierig'][t.stufe-1]+'</span></div>'+
   '<div class="prog"><span>'+(R.i+1)+' / '+total+' · '+R.hist.filter(h=>h.ok).length+' ✓</span><div class="bar"><i style="width:'+((R.i+1)/total*100)+'%"></i></div></div></div>'+
   body+'<div class="hint" id="hintBox" hidden>'+T.hint+'</div><div id="fb" role="status" aria-live="polite"></div>'+
   '<div class="actions"><div><button class="btn sm" data-a="hint">Tipp</button> <button class="btn sm" data-a="ref" data-v="'+T.ref+'">Nachschlagen</button></div>'+
   '<div><button class="btn primary" id="checkBtn" data-a="check" disabled>Überprüfen</button><button class="btn ok" id="nextBtn" data-a="next" hidden>'+(R.i+1<total?'Nächste Aufgabe →':'Auswertung anzeigen')+'</button></div></div></div>';
}
function checkRound(){
  const R=S.R,t=R.tasks[R.i];if(R.answered)return;
  let ok=false,mine='',right='',conf=null;
  if(t.typ==='anmalen'){
    const need=t.parts.map((p,i)=>p.f?i:-1).filter(i=>i>=0);
    if(need.some(i=>!R.paint[i])){document.getElementById('fb').innerHTML='<div class="fb err">Male zuerst alle Gruppen an.</div>';return;}
    ok=need.every(i=>R.paint[i]===t.parts[i].f);
    need.forEach(i=>{const b=document.querySelector('.chip[data-i="'+i+'"]');CK().forEach(k=>b.classList.remove('f-'+k,'p-'+k));b.classList.add(R.paint[i]===t.parts[i].f?'right':'wrong');b.classList.add('f-'+t.parts[i].f,'p-'+t.parts[i].f);});
    mine=need.map(i=>(R.paint[i]?CN()[R.paint[i]]:'–')).join(', ');right=need.map(i=>CN()[t.parts[i].f]).join(', ');
    need.forEach(i=>{if(R.paint[i]!==t.parts[i].f)conf=[t.parts[i].f,R.paint[i]];});
    document.querySelectorAll('.chip,.brush button').forEach(b=>b.disabled=true);
  }else if(t.tokens){
    if(!R.sel.size)return;
    const tg=new Set(t.targets);ok=t.tokens.every((_,i)=>R.sel.has(i)===tg.has(i));
    document.querySelectorAll('.tok').forEach(b=>{const i=Number(b.dataset.i);b.disabled=true;if(R.sel.has(i)&&tg.has(i))b.classList.add('right');else if(R.sel.has(i))b.classList.add('wrong');else if(tg.has(i))b.classList.add('miss');});
    mine=[...R.sel].sort((a,b)=>a-b).map(i=>t.tokens[i]).join(', ');right=t.targets.map(i=>t.tokens[i]).join(', ');
  }else if(isW(t)){
    const f=document.getElementById('wfield'),v=(f.value||'').trim();if(!v)return;
    const acc=[t.answer].concat(t.accept||[]);ok=acc.some(a=>normA(a,t.strict)===normA(v,t.strict));mine=v;right=t.answer;
    f.disabled=true;f.classList.add(ok?'right':'wrong');
  }else{
    if(R.choice===null)return;
    const got=R.order[R.choice];ok=got===t.answer;mine=got;right=t.answer;
    if(t.optCat&&!ok)conf=[t.optCat[t.answer],t.optCat[got]];
    document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(R.order[i]===t.answer)b.classList.add('right');else if(i===R.choice)b.classList.add('wrong');});
    document.querySelectorAll('.sbox .hl').forEach(h=>{if(t.cats.length===1)h.classList.add('f-'+t.cats[0]);});
  }
  R.answered=true;R.hist.push({t,ok,mine,right,conf});saveP(ok);
  document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'err')+'"><b>'+(ok?'✓ Richtig!':'✗ Nicht ganz richtig.')+'</b> '+t.why+'</div>';
  document.getElementById('checkBtn').hidden=true;document.getElementById('nextBtn').hidden=false;
}
function nextRound(){
  const R=S.R;
  if(R.i+1<R.tasks.length){R.i++;R.answered=false;R.choice=null;R.paint={};R.sel=new Set();R.order=null;R.hint=false;render();}
  else{S.screen='summary';render();}
}
function qText(t){return t.prompt||t.sent||(t.tokens?t.tokens.join(' '):'')||(t.parts?t.parts.map(p=>p.t).join(' '):'');}
function screenSummary(){
  const H=S.R.hist,tot=H.length,ok=H.filter(h=>h.ok).length,pct=tot?Math.round(ok/tot*100):0;
  const grp=(keyf,labf)=>{const m={};H.forEach(h=>{const k=keyf(h);(m[k]=m[k]||{o:0,n:0,l:labf(h)});m[k].n++;if(h.ok)m[k].o++;});return Object.values(m).sort((a,b)=>a.o/a.n-b.o/b.n);};
  const card=g=>g.map(x=>{const p=Math.round(x.o/x.n*100),col=p>=80?'var(--ok)':p>=50?'var(--warn)':'var(--bad)';return '<div class="cat"><div class="top"><span>'+x.l+'</span><span style="color:'+col+'">'+x.o+' / '+x.n+' ('+p+' %)</span></div><div class="b"><i style="width:'+p+'%;background:'+col+'"></i></div></div>';}).join('');
  const byType=grp(h=>h.t.typ,h=>TY()[h.t.typ].label);
  const byFall=grp(h=>h.t.cats.length===1?h.t.cats[0]:'mehr',h=>h.t.cats.length===1?CN()[h.t.cats[0]]:'Mehrere '+C().catWord+'e');
  const cf={};H.forEach(h=>{if(h.conf&&h.conf[0]&&h.conf[1]){const k=h.conf[0]+'>'+h.conf[1];cf[k]=(cf[k]||0)+1;}});
  const cl=Object.entries(cf).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,n])=>{const [a,b]=k.split('>');return '<li>Du hast '+catTag(a)+' als '+catTag(b)+' angegeben ('+n+'×).</li>';}).join('');
  const wrong=H.filter(h=>!h.ok);
  const worst=wrong.length?TY()[wrong[0].t.typ].ref:'proben';
  return '<div class="card"><div class="sumhead"><div class="muted" style="font-weight:700">Auswertung</div><div class="score">'+ok+' / '+tot+' ('+pct+' %)</div><div class="muted">'+(pct>=80?'Sehr gut, du bist sicher.':pct>=50?'Gut, einige Stellen noch üben.':'Schau dir die Proben nochmals an und übe weiter.')+'</div></div>'+
   '<h3>Nach '+C().catWord+'</h3><div class="grid3" style="margin:.5rem 0 1.2rem">'+card(byFall)+'</div><h3>Nach Aufgabentyp</h3><div class="grid3" style="margin:.5rem 0 1.2rem">'+card(byType)+'</div>'+
   (cl?'<div class="callout info"><b>Typische Verwechslungen</b><ul style="margin:.3rem 0 0;padding-left:1.2rem">'+cl+'</ul></div>':'')+
   '<div class="actions" style="justify-content:flex-start;margin:1.2rem 0">'+(wrong.length?'<button class="btn primary" data-a="retry">Fehler gezielt wiederholen ('+wrong.length+')</button>':'')+
   '<button class="btn" data-a="again">Neue Runde</button><button class="btn" data-a="ref" data-v="'+worst+'">Zur passenden Theorie</button><button class="btn" data-a="home">Zur Übersicht</button></div>'+
   '<h3>Alle Fragen</h3>'+H.map((h,i)=>'<div class="rev '+(h.ok?'ok':'err')+'"><b>'+(i+1)+'. '+TY()[h.t.typ].label+'</b> '+(h.ok?'· richtig':'· falsch')+'<div class="muted" style="margin:.2rem 0">'+qText(h.t)+'</div><div>Deine Antwort: '+h.mine+'</div>'+(h.ok?'':'<div style="color:var(--ok)"><b>Richtig:</b> '+h.right+'</div>')+'</div>').join('')+'</div>';
}
function render(){
  renderHead();
  $app.innerHTML=({start:screenStart,teach:screenTeach,lernen:screenLernen,config:screenConfig,round:screenRound,summary:screenSummary,sheet:screenSheet})[S.screen]();

function renderTry(el){
  const types=el.dataset.types.split(',');
  const pool=visibleTasks().filter(t=>types.includes(t.typ));if(!pool.length){el.hidden=true;return;}
  let t,n=0;do{t=pool[Math.floor(Math.random()*pool.length)];n++;}while(String(t.id)===el.dataset.tid&&pool.length>1&&n<20);
  el.dataset.tid=t.id;el._t=t;el._o=shuffle(t.opts);
  el.innerHTML='<span class="pill">Probier es aus</span><div class="instr" style="margin-top:.5rem">'+TY()[t.typ].instr+'</div><div class="sbox">'+(t.prompt||t.sent)+'</div><div class="opts">'+
   el._o.map((o,i)=>{const f=t.optCat&&t.optCat[o];return '<button class="opt '+(f?'fall f-'+f:'')+'" data-a="tpick" data-i="'+i+'">'+o+'</button>';}).join('')+'</div><div class="tfb" role="status" aria-live="polite"></div>';
}
function tryPick(b){
  const el=b.closest('[data-w="try"]');if(el.dataset.done)return;el.dataset.done='1';
  const t=el._t,i=Number(b.dataset.i),ok=el._o[i]===t.answer;
  el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(el._o[j]===t.answer)x.classList.add('right');else if(j===i)x.classList.add('wrong');});
  el.querySelector('.tfb').innerHTML='<div class="fb '+(ok?'ok':'err')+'"><b>'+(ok?'✓ Richtig!':'✗ Nicht ganz richtig.')+'</b> '+t.why+'</div><div style="margin-top:.7rem"><button class="btn primary" data-a="tnext">Nächste Aufgabe →</button></div>';
}
function initTry(root){(root||document).querySelectorAll('[data-w="try"]').forEach(renderTry);}

function sheetItem(t){
  const T=TY()[t.typ]||{};let q,a,opts=null,instr=T.instr||'',kind='line';
  if(t.parts){
    q=t.parts.map(p=>p.f?'<u>'+esc(p.t)+'</u>':esc(p.t)).join(' ');
    a=t.parts.filter(p=>p.f).map(p=>esc(p.t.replace(/[.,]$/,''))+' → '+esc(CN()[p.f])).join('; ');
    instr='Bestimme die unterstrichenen Wörter und schreibe die Bezeichnung darüber.';kind='para';
  }else if(t.tokens){
    q=t.tokens.map((x,i)=>t.targets.includes(i)?x:x).join(' ');q=esc(q);
    a=t.targets.map(i=>esc(t.tokens[i])).join(', ');instr=t.instr||instr;kind='para';
  }else{
    q=(t.prompt&&t.sent?t.prompt+'<br>'+t.sent:(t.sent||t.prompt));a=esc(t.answer);
    if(t.input||(t.w))instr=T.winstr||instr;
    else if(t.opts){opts=shuffle(t.opts);}
    if(t.input&&t.prompt&&t.sent)instr=T.instr||'';
    if(opts)kind='opts';
  }
  instr=instr.replace(/Tippe (.+?) an\.?$/,'Unterstreiche $1.').replace(/Wähle /,'Kreuze an: ');
  return{typ:t.typ,q,a,opts,kind,instr};
}
function sheetHTML(items,title){

function buildPoolSheet(){

async function loadAiKeys(){
  if(!S.user)throw new Error('Bitte mit dem Lehrerkonto anmelden.');
  if(!window.firebase||!firebase.firestore)throw new Error('Die Verbindung zum Konto ist nicht verfügbar.');
  const snap=await firebase.firestore().collection('sekSync').doc('apikeys_'+S.user.uid).get();
  const d=snap.exists?(snap.data()||{}):{};
  const clean=k=>String(k||'').trim().replace(/^["']|["']$/g,'');
  const keys={gemini:clean(d.geminiKey),claude:clean(d.claudeKey),openai:clean(d.openaiKey),mistral:clean(d.mistralKey)};
  const P=['gemini','claude','openai','mistral'];
  const order=[...new Set([...(Array.isArray(d.aiOrder)?d.aiOrder:[]).filter(x=>P.includes(x)),...P])].filter(p=>keys[p]);
  if(!order.length)throw new Error('Im Konto ist kein KI-Schlüssel gespeichert. Hinterlege ihn im Sek Planer (Einstellungen) mit demselben Konto.');
  return{keys,order};
}
async function fetchT(url,opt,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms||90000);try{return await fetch(url,Object.assign({signal:c.signal},opt));}finally{clearTimeout(t);}}
async function askAI(system,user){
  const {keys,order}=await loadAiKeys();const errs=[];
  for(const p of order){
    try{
      if(p==='claude'){
        for(const m of ['claude-sonnet-5-5','claude-haiku-5-5']){
          try{
            const r=await fetchT('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':keys.claude,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:m,max_tokens:6000,system,messages:[{role:'user',content:user}]})});
            const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
            const t=(j.content||[]).map(x=>x.text||'').join('');if(t)return t;
          }catch(e){errs.push('Claude '+m+': '+e.message);}
        }
      }else if(p==='gemini'){
        for(const m of ['gemini-flash-latest','gemini-2.5-flash']){
          try{
            const r=await fetchT('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':keys.gemini},body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{responseMimeType:'application/json'}})});
            const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('HTTP '+r.status));
            const t=((((j.candidates||[])[0]||{}).content||{}).parts||[]).map(x=>x.text||'').join('');if(t)return t;
          }catch(e){errs.push('Gemini '+m+': '+e.message);}
        }
      }else{
        const cfg=p==='openai'?{u:'https://api.openai.com/v1/chat/completions',m:['gpt-4o-mini']}:{u:'https://api.mistral.ai/v1/chat/completions',m:['mistral-large-latest','mistral-small-latest']};
        for(const m of cfg.m){
          try{
            const r=await fetchT(cfg.u,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+keys[p]},body:JSON.stringify({model:m,messages:[{role:'system',content:system},{role:'user',content:user}]})});
            const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&(j.error.message||j.error))||('HTTP '+r.status));
            const t=(((j.choices||[])[0]||{}).message||{}).content;if(t)return t;
          }catch(e){errs.push(p+' '+m+': '+e.message);}
        }
      }
    }catch(e){errs.push(p+': '+e.message);}
  }
  throw new Error('Die KI hat nicht geantwortet. '+errs.slice(0,3).join(' | '));
}
function aiPrompt(){
  const c=S.cfg,want=wanted(c),types=[...c.types].filter(k=>typesAvailable().includes(k));
  const cats=[...c.cats].map(k=>CN()[k]).join(', ');
  const ex=types.map(k=>{
    const t=visibleTasks().find(x=>x.typ===k&&!x.parts);if(!t)return null;const it=sheetItem(t);
    const strip=h=>String(h).replace(/<br>/g,' ').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
    return {typ:k,q:strip(it.q),a:strip(it.a),opts:it.opts?it.opts.slice(0,4):undefined};
  }).filter(Boolean);
  const tl=types.map(k=>{const T=TY()[k];return '- '+k+': '+T.label+' ('+(T.short||'')+'). Anweisung: '+(T.winstr||T.instr||'');}).join('\n');
  const system='Du bist eine erfahrene Deutschlehrperson der Sekundarstufe I in der Schweiz (Niveau '+S.niv+', Schülerinnen und Schüler 13 bis 15 Jahre). Du erstellst Grammatik-Übungsaufgaben. Schweizer Rechtschreibung (immer «ss», nie «ß»). Sprache einfach und altersgerecht. Jede Aufgabe hat genau eine korrekte, fachlich gesicherte Lösung. Keine Wiederholungen. Antworte ausschliesslich mit einem JSON-Array, ohne Text davor oder danach.';
  const user='Kapitel: '+C().title+'\nThemen: '+cats+'\nSchwierigkeit: '+(c.stufe==='mix'?'gemischt (einfach bis schwierig)':({1:'einfach',2:'mittel',3:'schwierig'})[c.stufe])+'\nAnzahl Aufgaben: genau '+want+', gleichmässig auf die Aufgabentypen verteilt.\nAufgabentypen (Feld «typ»):\n'+tl+'\n'+(S.shint.trim()?'Wunsch der Lehrperson: '+S.shint.trim()+'\n':'')+
   '\nFormat jedes Elements: {"typ":"<Typ>","q":"<Aufgabentext>","a":"<Lösung>","opts":["<4 Antwortmöglichkeiten, nur bei Auswahlaufgaben, die Lösung ist eine davon>"]}\n- Lückenaufgaben: Lücke als ___ schreiben, «a» enthält nur das fehlende Wort.\n- Markieren/Text: «q» ist der Satz oder kurze Text, «a» die gesuchten Wörter, getrennt durch Komma.\n- Frage- und Wissensaufgaben ohne Lücke: «q» ist die Frage.\nBeispiele zur Orientierung (nicht wiederverwenden):\n'+JSON.stringify(ex);
  return{system,user,types};
}
async function buildAiSheet(){
  const {system,user,types}=aiPrompt();
  const txt=await askAI(system,user);
  const i=txt.indexOf('['),j=txt.lastIndexOf(']');if(i<0||j<i)throw new Error('Die Antwort der KI war nicht lesbar. Bitte nochmals versuchen.');
  let arr;try{arr=JSON.parse(txt.slice(i,j+1));}catch(e){throw new Error('Die Antwort der KI war nicht lesbar. Bitte nochmals versuchen.');}
  const out=[];
  arr.forEach(x=>{
    if(!x||!types.includes(x.typ)||!x.q||x.a==null)return;
    const T=TY()[x.typ]||{},mark=!!(T.instr&&/Tippe/.test(T.instr));
    const a=Array.isArray(x.a)?x.a.join(', '):String(x.a);
    const hasOpts=Array.isArray(x.opts)&&x.opts.length>1;
    out.push({typ:x.typ,q:esc(x.q).replace(/___/g,'_____'),a:esc(a),opts:hasOpts?shuffle(x.opts.map(String)):null,kind:hasOpts?'opts':(mark?'para':'line'),instr:(mark?T.instr:(hasOpts?(T.instr||''):(T.winstr||T.instr||''))).replace(/Tippe (.+?) an\.?$/,'Unterstreiche $1.')});
  });
  if(!out.length)throw new Error('Die KI hat keine brauchbaren Aufgaben geliefert. Bitte nochmals versuchen.');
  return out.slice(0,wanted(S.cfg));
}
